[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-fire3d"
version = "0.1.0"
description = "Independent FIRE3D reconstruction runtime and dataset adapter"
requires-python = ">=3.10,<3.13"
dependencies = ["modal>=1.5,<2", "modal-world>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.uv.sources]
modal-world = { path = "../modal-world", editable = true }

[tool.setuptools.packages.find]
include = ["modal_fire3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
