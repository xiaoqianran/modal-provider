<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>modal-gen · 本地生成控制台</title>
    <link rel="stylesheet" href="/ui/assets/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="rail">
        <div class="rail__brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div class="brand__text">
            <span class="brand__name">modal-gen</span>
            <span class="brand__sub">本地生成控制台</span>
          </div>
        </div>

        <nav class="rail__nav" id="nav" aria-label="主导航"></nav>

        <div class="rail__foot" id="rail-foot">
          <div class="conn-card" id="conn-card">
            <span class="conn-dot" id="conn-dot"></span>
            <div class="conn-text">
              <span class="conn-state" id="conn-state">检测中</span>
              <span class="conn-id" id="conn-id">Connector —</span>
            </div>
          </div>
          <span class="pill pill--demo" id="mode-badge" hidden>演示</span>
        </div>
      </aside>

      <main class="main" id="screen" aria-live="polite"></main>
    </div>

    <div id="toast-host" class="toast-host" aria-live="polite"></div>
    <div id="drawer-host" class="drawer-host"></div>
    <div id="dialog-host" class="dialog-host"></div>

    <script type="module" src="/ui/assets/app.js"></script>
  </body>
</html>
