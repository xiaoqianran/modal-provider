name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --dev --frozen
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_gen tests
      - run: uv run pytest -q
      - run: uv build
      - name: Validate installed entrypoint
        run: uv run python -c "from modal_gen.server import main; assert callable(main)"
