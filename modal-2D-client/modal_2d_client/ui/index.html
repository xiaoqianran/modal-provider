<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>modal-2D Agent · Image Studio</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">M<span>2</span></a>
    <div class="brand-copy"><strong>modal-2D</strong><small>Image Studio</small></div>
    <div class="top-actions"><span class="status" id="agent-status"><i></i><span>检测中</span></span><button class="icon-btn" id="open-settings" type="button">设置</button></div>
  </header>
  <main class="studio">
    <section class="composer panel">
      <div class="section-title"><div><span class="kicker">CREATE</span><h1>生成一张图片</h1></div><span class="model-note">1024 × 1024 · 2 steps</span></div>
      <label class="prompt-wrap"><textarea id="prompt" maxlength="4000" rows="5" placeholder="描述你想生成的画面……"></textarea><span id="prompt-count">0 / 4000</span></label>
      <div class="controls">
        <label><span>模型</span><select id="model"><option value="sana-sprint-1.6b">SANA-Sprint 1.6B</option><option value="sana-sprint-0.6b">SANA-Sprint 0.6B</option></select></label>
        <label id="seed-wrap"><span>Seed</span><input id="seed" type="number" min="0" max="4294967295" value="42"></label>
        <label><span>Guidance</span><input id="guidance" type="number" min="0" max="20" step="0.1" placeholder="默认"></label>
      </div>
      <div class="batch-row"><label class="switch"><input id="batch-toggle" type="checkbox"><span></span>批量候选</label><label class="batch-seeds" id="batch-seeds-wrap" hidden><span>Seeds</span><input id="seeds" value="42, 73, 104, 135"></label></div>
      <div class="generate-row"><p id="form-message">输入 Modal Token 后即可生成。</p><button class="generate" id="generate" type="button"><span>生成图片</span><kbd>⌘ ↵</kbd></button></div>
    </section>
    <section class="result panel">
      <div class="section-title compact"><div><span class="kicker">RESULT</span><h2>生成结果</h2></div><span class="job-state" id="job-state">等待生成</span></div>
      <div class="canvas">
        <div class="empty" id="result-empty"><div class="empty-mark">✦</div><strong>结果会显示在这里</strong><span>PNG · 1024 × 1024</span></div>
        <div class="progress" id="result-progress" hidden><i></i><strong>正在生成</strong><span id="progress-copy">任务已提交，等待 GPU 返回结果</span></div>
        <img id="result-image" alt="生成结果" hidden>
      </div>
      <div class="result-footer"><div class="candidate-tabs" id="candidate-tabs"></div><div class="result-actions"><span id="verify-state">尚无产物</span><button class="secondary" id="download" type="button" disabled>下载 PNG</button></div></div>
    </section>
    <section class="jobs panel">
      <div class="section-title compact"><div><span class="kicker">RECENT</span><h2>最近任务</h2></div><button class="text-btn" id="refresh-jobs" type="button">刷新</button></div>
      <div class="job-list" id="job-list"><div class="list-empty">还没有生成任务</div></div>
    </section>
  </main>
  <aside class="drawer" id="settings" aria-hidden="true">
    <div class="drawer-head"><div><span class="kicker">SETTINGS</span><h2>连接 Modal</h2></div><button class="close" id="close-settings" type="button">×</button></div>
    <p class="drawer-copy">凭据只保存在当前 Agent 进程内存中，不写入数据库或日志。</p>
    <label><span>粘贴 modal token set 命令</span><input id="token-command" type="password" autocomplete="off" placeholder="modal token set --token-id ak-... --token-secret as-..."></label>
    <p class="parse-hint" id="parse-hint">粘贴后自动提取 ID 和 Secret。</p>
    <label><span>Modal Token ID</span><input id="token-id" autocomplete="off" placeholder="ak-..."></label>
    <label><span>Modal Token Secret</span><input id="token-secret" type="password" autocomplete="off" placeholder="as-..."></label>
    <label><span>本地 Agent Session（可选）</span><input id="session-token" type="password" autocomplete="off" placeholder="X-Modal-2D-Session"></label>
    <div class="drawer-actions"><button class="secondary" id="disconnect" type="button">断开</button><button class="generate" id="connect" type="button">连接 Modal</button></div>
    <p class="drawer-status" id="drawer-status"></p>
    <details><summary>API 调试信息</summary><pre id="debug-log">尚无请求</pre></details>
  </aside>
  <div class="scrim" id="scrim" hidden></div><div class="toasts" id="toasts"></div>
  <script src="./app.js" defer></script>
</body>
</html>
