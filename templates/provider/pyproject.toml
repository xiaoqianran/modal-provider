[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-example-provider"
version = "0.1.0"
requires-python = ">=3.12"
description = "CPU reference for Modal Provider Standard v1"
dependencies = []

[project.optional-dependencies]
modal = ["modal>=1.5,<2"]

[tool.setuptools.packages.find]
include = ["modal_example*"]
