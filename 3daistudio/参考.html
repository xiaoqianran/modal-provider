<style>
  /* 自定义滚动条 */
  .sleek-scrollbar::-webkit-scrollbar { width: 6px; }
  .sleek-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .sleek-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(113, 113, 122, 0.3);
    border-radius: 3px;
  }
  .sleek-scrollbar::-webkit-scrollbar-thumb:hover {
    background: rgba(113, 113, 122, 0.5);
  }

  /* 骨架屏动画 */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

  /* range 滑块样式 */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 9999px;
    background: #3f3f46;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #d4d4d8;
    margin-top: -4px;
    transition: background 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { background: #ffffff; }
  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 9999px;
    background: #3f3f46;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: #d4d4d8;
    transition: background 0.15s;
  }
  input[type="range"]::-moz-range-thumb:hover { background: #ffffff; }

  /* 侧边栏导航项 hover */
  .nav-item {
    transition: all 0.2s;
  }
</style>
