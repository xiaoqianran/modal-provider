name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    name: Runtime architecture gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-provider-architecture.py
      - run: python scripts/check-legacy-providers.py
      - run: python -m unittest discover -s templates/provider/tests -v
      - run: python -m pip install build
      - run: python -m build templates/provider --outdir templates/provider/dist
      - run: python -m pip install templates/provider/dist/*.whl
      - run: python -m unittest discover -s templates/provider/tests -v
        env:
          PROVIDER_TEST_INSTALLED: "1"
      - run: python scripts/check-runtime-architecture.py
      - run: python -m unittest discover -s scripts/tests -v

  studio-web:
    name: 3daistudio / Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 3daistudio
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 3daistudio/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run cf:check

  modal-gen-client:
    name: modal-gen-client / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-gen-client
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modal-gen-client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - name: Sync dependencies from official PyPI
        env:
          UV_INDEX_URL: https://pypi.org/simple
        run: uv sync --dev --frozen
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_gen tests
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python -c "from modal_gen.server import main; assert callable(main)"

  modal-2d:
    name: modal-2D / provider + client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-2D
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra client --dev --frozen
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_2d tests client_tests
      - run: uv run pytest -q tests client_tests
      - run: uv run python -c "import modal_2d.app"
      - run: uv run python -c "from modal_2d.client.server import main; assert callable(main)"

  modal-3d:
    name: modal-3D / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modal-3D
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Report legacy lock drift
        continue-on-error: true
        run: uv lock --check
      - run: uv sync --frozen
      - run: uv run python -m compileall -q modal_3d
      - run: uv run python -m unittest discover -s tests -v
      - name: Client adapter (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          uv sync --extra client --group dev --frozen
          uv run ruff check modal_3d/client client_tests
          uv run python -m compileall -q modal_3d/client client_tests
          uv run pytest -q client_tests
          uv run python -c "from modal_3d.client.server import main; assert callable(main)"

  modal-embodiedgen:
    name: modal-EmbodiedGen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-EmbodiedGen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv run --isolated --with pytest --with "modal>=1.5,<2" python -m compileall -q embodied_gen modal
      - run: uv run --isolated --with pytest --with "modal>=1.5,<2" --with "numpy==1.26.4" pytest -q modal/tests

  modal-build:
    name: modal-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - run: uv run --isolated --with "modal>=1.5,<2" python -m compileall -q integrations
      - run: uv run --isolated --with "modal>=1.5,<2" python -m unittest discover -s integrations/birefnet/tests -v
      - run: uv run --isolated --with "modal>=1.5,<2" python -m unittest discover -s integrations/hyworld2/tests -v

  modal-fire3d:
    name: modal-fire3d
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-fire3d
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check modal_fire3d tests
      - run: uv run python -m compileall -q modal_fire3d tests
      - run: uv run pytest -q

  modal-world:
    name: modal-world
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-world
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check modal_world tests
      - run: uv run python -m compileall -q modal_world tests
      - run: uv run pytest -q

