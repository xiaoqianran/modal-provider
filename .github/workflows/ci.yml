name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modal-gen-client:
    name: modal-gen-client / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-gen-client
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - name: Sync dependencies from official PyPI
        env:
          UV_INDEX_URL: https://pypi.org/simple
        run: uv sync --dev --frozen
      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_gen tests
      - run: uv run pytest -q
      - run: uv build
      - run: uv run python -c "from modal_gen.server import main; assert callable(main)"

  modal-2d-client:
    name: modal-2D-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-2D-client
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_2d_client tests
      - run: uv run pytest -q
      - run: uv run python -c "from modal_2d_client.server import main; assert callable(main)"

  modal-2d:
    name: modal-2D
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-2D
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_2d tests
      - run: uv run pytest -q
      - run: uv run python -c "import modal_2d.app"

  modal-3d-client:
    name: modal-3D-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-3D-client
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run python -m compileall -q modal_3d_client tests
      - run: uv run pytest -q

  modal-3d:
    name: modal-3D / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: modal-3D
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Report legacy lock drift
        continue-on-error: true
        run: uv lock --check
      - run: uv sync --frozen
      - run: uv run python -m compileall -q modal_3d
      - run: uv run python -m unittest discover -s tests -v

  modal-embodiedgen:
    name: modal-EmbodiedGen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modal-EmbodiedGen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen python -m compileall -q modal_build runtime tests
      - run: uv run --frozen --with pytest pytest -q
