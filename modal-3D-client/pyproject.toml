[project]
name = "modal-3d-client"
version = "0.1.0"
description = "Reference sidecar for modal-3D provider execution and artifact retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "modal[api-proxy-support]",
    "modal-3d",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic",
    "python-multipart",
    "scipy>=1.16,<2",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[project.entry-points."modal_gen.providers"]
modal-3d = "modal_3d_client.provider:create_provider"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modal_3d_client*"]

[tool.setuptools.package-data]
modal_3d_client = ["capabilities.json", "static/*"]

[tool.uv.sources]
modal-3d = { path = "../modal-3D", editable = true }
