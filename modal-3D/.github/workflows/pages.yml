name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Validate benchmark data and GLBs
        run: python scripts/validate_pages.py --site site

      - name: Prepare immutable Pages artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a site _site
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          target = Path("_site/data/deployment.json")
          target.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          test -f _site/.nojekyll
          du -sh _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.0
