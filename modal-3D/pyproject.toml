[project]
name = "modal-3d"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["modal[api-proxy-support]>=1.5,<2"]

[project.optional-dependencies]
client = [
    "fastapi",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic",
    "python-multipart",
    "scipy>=1.16,<2",
    "uvicorn",
]

[project.scripts]
modal-3d-agent = "modal_3d.client.server:main"

[project.entry-points."modal_gen.providers"]
modal-3d = "modal_3d.client.provider:create_provider"

[tool.setuptools.package-data]
"modal_3d.client" = ["capabilities.json", "static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "numpy==2.3.5", "Pillow==12.1.0", "pytest>=8,<10", "ruff>=0.11,<1", "scipy==1.16.3"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modal_3d*"]
